[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["node_modules"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = ["solady/=node_modules/solady/src/"]

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 64
fail_on_revert = false

[lint]
# Narrowing casts are bounded where they are made: shares are checked against
# uint128 when a position opens, and horizon and lock term are capped at 2^20 epochs.
exclude_lints = ["unsafe-typecast"]
